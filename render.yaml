services:
  - type: web
    name: leksin-backend
    runtime: docker
    region: singapore
    plan: starter
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: leksin-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: leksin-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: leksin-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: leksin-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: leksin-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JPA_DDL_AUTO
        value: update
      - key: MAIL_HOST
        value: smtp-relay.brevo.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_SMTP_AUTH
        value: "true"
      - key: MAIL_SMTP_STARTTLS
        value: "true"

databases:
  - name: leksin-db
    region: singapore
    plan: basic-256mb
    databaseName: leksin
    user: leksin
    ipAllowList: []