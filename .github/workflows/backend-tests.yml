name: Backend tests

on:
  push:
    branches:
      - main
      - "test/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Gradle test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Grant execute permission
        run: chmod +x ./gradlew
      - name: Run tests
        run: ./gradlew --no-daemon clean test
