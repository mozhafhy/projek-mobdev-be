services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leksin-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 8080
      DB_HOST: database
      DB_PORT: 5432
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      database:
        condition: service_healthy
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  database:
    image: postgres:16-alpine
    container_name: leksin-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-leksin}
      POSTGRES_USER: ${DB_USERNAME:-leksin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-leksin} -d ${DB_NAME:-leksin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
